<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <style>
    .st0{fill:#4D8076;}
    .st1{fill:#6F58C9;}
    .st2{fill:#F87060;}
    .st3{fill:#FFFFFF;}
    .st4{fill:#2B2D42;}
    .st5{fill:#F9F9F9;}
    .st6{fill:#EDF2F4;}
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    .float {
      animation: float 6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .pulse {
      animation: pulse 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Circle -->
  <circle class="st6" cx="250" cy="250" r="240"/>
  
  <!-- Decorative Circles -->
  <circle class="st0 pulse" cx="100" cy="150" r="20" opacity="0.6"/>
  <circle class="st1 pulse" cx="400" cy="180" r="15" opacity="0.6"/>
  <circle class="st2 pulse" cx="380" cy="350" r="25" opacity="0.6"/>
  <circle class="st0 pulse" cx="150" cy="400" r="18" opacity="0.6"/>
  
  <!-- Decorative Shapes -->
  <path class="st1" d="M420,120 L450,150 L420,180 Z" opacity="0.7"/>
  <path class="st0" d="M80,300 L50,330 L80,360 Z" opacity="0.7"/>
  <rect class="st2" x="350" y="100" width="30" height="30" rx="5" opacity="0.7"/>
  <rect class="st0" x="120" y="340" width="25" height="25" rx="5" opacity="0.7"/>
  
  <!-- Developer Figure - Abstract Representation -->
  <g class="float" transform="translate(250, 250)">
    <!-- Head -->
    <circle class="st3" cx="0" cy="-60" r="60"/>
    <circle class="st4" cx="-20" cy="-60" r="5"/> <!-- Left eye -->
    <circle class="st4" cx="20" cy="-60" r="5"/> <!-- Right eye -->
    <path class="st4" d="M-15,-40 Q0,-30 15,-40" fill="none" stroke-width="3" stroke="#2B2D42"/> <!-- Smile -->
    
    <!-- Body -->
    <rect class="st0" x="-50" y="10" width="100" height="120" rx="10"/>
    
    <!-- Arms -->
    <rect class="st3" x="-90" y="20" width="40" height="20" rx="10" transform="rotate(-20, -90, 20)"/>
    <rect class="st3" x="50" y="20" width="40" height="20" rx="10" transform="rotate(20, 50, 20)"/>
    
    <!-- Laptop -->
    <rect class="st5" x="-40" y="70" width="80" height="50" rx="5"/>
    <rect class="st4" x="-35" y="75" width="70" height="40" rx="2"/>
    <circle class="st2" cx="0" cy="95" r="5"/>
    
    <!-- Code Elements -->
    <rect class="st3" x="-25" y="85" width="20" height="3" rx="1"/>
    <rect class="st3" x="-25" y="92" width="30" height="3" rx="1"/>
    <rect class="st3" x="-25" y="99" width="15" height="3" rx="1"/>
    <rect class="st3" x="5" y="85" width="15" height="3" rx="1"/>
    <rect class="st3" x="5" y="92" width="10" height="3" rx="1"/>
    <rect class="st3" x="5" y="99" width="20" height="3" rx="1"/>
  </g>
  
  <!-- Abstract Code Elements -->
  <g opacity="0.8">
    <path class="st1" d="M70,180 L100,180 L85,200 Z" />
    <path class="st2" d="M390,270 L420,270 L405,290 Z" />
    <rect class="st0" x="80" y="210" width="30" height="10" rx="3"/>
    <rect class="st1" x="370" y="230" width="40" height="10" rx="3"/>
  </g>
</svg>